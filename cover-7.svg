<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#701a75"/>
    </linearGradient>
    <radialGradient id="fall7" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="300" fill="url(#bg7)"/>
  <circle cx="30" cy="46" r="1.6" fill="#fff" opacity=".85"/>
  <circle cx="72" cy="22" r="1.3" fill="#fff" opacity=".7"/>
  <circle cx="140" cy="40" r="1.5" fill="#fff" opacity=".8"/>
  <circle cx="176" cy="90" r="1.4" fill="#fff" opacity=".7"/>
  <circle cx="50" cy="120" r="1.3" fill="#fff" opacity=".6"/>
  <circle cx="120" cy="150" r="1.4" fill="#fff" opacity=".8"/>
  <circle cx="160" cy="170" r="1.3" fill="#fff" opacity=".6"/>
  <!-- падающая звезда -->
  <line x1="150" y1="62" x2="122" y2="90" stroke="url(#fall7)" stroke-width="3" stroke-linecap="round"/>
  <!-- созвездие-сердце -->
  <g fill="#fda4af">
    <circle cx="86" cy="150" r="4"/>
    <circle cx="114" cy="150" r="4"/>
    <circle cx="78" cy="166" r="4"/>
    <circle cx="122" cy="166" r="4"/>
    <circle cx="100" cy="182" r="5"/>
    <circle cx="92" cy="160" r="3"/>
    <circle cx="108" cy="160" r="3"/>
  </g>
  <g stroke="#fda4af" stroke-width="1.2" opacity=".8">
    <line x1="86" y1="150" x2="92" y2="160"/>
    <line x1="114" y1="150" x2="108" y2="160"/>
    <line x1="92" y1="160" x2="78" y2="166"/>
    <line x1="108" y1="160" x2="122" y2="166"/>
    <line x1="78" y1="166" x2="100" y2="182"/>
    <line x1="122" y1="166" x2="100" y2="182"/>
  </g>
  <text x="100" y="212" font-size="13.5" font-family="Georgia, serif" font-style="italic" fill="#fbcfe8" text-anchor="middle">«Виноваты звёзды»</text>
  <rect x="0" y="238" width="200" height="62" fill="rgba(30,27,75,.78)"/>
  <rect y="238" width="200" height="3" fill="#f472b6"/>
  <text x="100" y="264" font-size="16" font-family="Georgia, serif" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">ВИНОВАТЫ ЗВЁЗДЫ</text>
  <text x="100" y="285" font-size="11.5" font-family="Arial, sans-serif" fill="#fbcfe8" text-anchor="middle">Джон Грин</text>
</svg>
