<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-label="Стопка книг">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="55%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="hspine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="404" height="284" rx="30" fill="url(#hbg)"/>
  <circle cx="64" cy="52" r="46" fill="rgba(255,255,255,0.14)"/>
  <circle cx="372" cy="252" r="58" fill="rgba(255,255,255,0.12)"/>
  <circle cx="340" cy="60" r="24" fill="rgba(255,255,255,0.16)"/>
  <!-- стопка лежащих книг -->
  <rect x="86" y="206" width="248" height="26" rx="7" fill="#8b5cf6"/>
  <rect x="96" y="178" width="228" height="26" rx="7" fill="#22c55e"/>
  <rect x="106" y="150" width="208" height="26" rx="7" fill="#f43f5e"/>
  <rect x="116" y="122" width="188" height="26" rx="7" fill="#0ea5e9"/>
  <!-- страницы -->
  <line x1="120" y1="135" x2="290" y2="135" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
  <line x1="120" y1="163" x2="288" y2="163" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
  <line x1="120" y1="191" x2="300" y2="191" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
  <line x1="120" y1="219" x2="310" y2="219" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
  <!-- стоящая книга справа -->
  <g transform="translate(282,44) rotate(7)">
    <rect x="0" y="0" width="34" height="150" rx="6" fill="url(#hspine)"/>
    <line x1="10" y1="10" x2="10" y2="140" stroke="rgba(255,255,255,0.5)" stroke-width="1.6"/>
    <line x1="24" y1="14" x2="24" y2="136" stroke="rgba(20,12,50,0.25)" stroke-width="1.2"/>
  </g>
  <!-- эмодзи -->
  <text x="262" y="150" font-size="34">🐛</text>
  <text x="90" y="80" font-size="28">✨</text>
  <text x="330" y="200" font-size="24">📖</text>
  <text x="60" y="230" font-size="22">⭐</text>
</svg>
