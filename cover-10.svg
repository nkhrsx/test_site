  <circle cx="50" cy="190" r="1.4" fill="#fff" opacity=".6"/>
  <ellipse cx="100" cy="128" rx="82" ry="26" fill="none" stroke="rgba(148,163,184,.5)" stroke-width="1.2" stroke-dasharray="4 5" transform="rotate(-14 100 128)"/>
  <circle cx="150" cy="96" r="17" fill="url(#planet10a)"/>
  <circle cx="62" cy="130" r="12" fill="url(#planet10b)"/>
  <circle cx="122" cy="166" r="9" fill="url(#planet10c)"/>
